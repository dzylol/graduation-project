[project]
name = "bi-mamba-chem"
version = "0.1.0"
description = "Bidirectional Mamba SSM for molecular property prediction"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "rdkit-pypi>=2022.9.5",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"
